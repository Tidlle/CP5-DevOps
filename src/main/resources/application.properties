spring.application.name=dimdim

# Credenciais NUNCA ficam no codigo: vem de variaveis de ambiente (App Settings do Azure Web App)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# As tabelas sao criadas pelo scripts/ddl.sql; o JPA apenas valida o schema
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# O App Service Linux envia o trafego para a porta 8080
server.port=${PORT:8080}

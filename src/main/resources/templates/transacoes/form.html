<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Transação')}"></head>
<body>
<header th:replace="~{fragments/layout :: topo}"></header>
<main>
    <div class="card">
        <h2 th:text="${transacaoId == null} ? 'Nova transação' : 'Editar transação'"></h2>
        <div th:replace="~{fragments/layout :: mensagens}"></div>
        <form method="post" th:object="${form}"
              th:action="${transacaoId == null} ? @{/transacoes} : @{/transacoes/{id}(id=${transacaoId})}">
            <label for="contaId">Conta</label>
            <select id="contaId" th:field="*{contaId}">
                <option value="">Selecione...</option>
                <option th:each="c : ${contas}" th:value="${c.id}"
                        th:text="${c.numero + ' - ' + c.titular + ' (saldo R$ ' + #numbers.formatDecimal(c.saldo, 1, 'POINT', 2, 'COMMA') + ')'}"></option>
            </select>
            <div class="erro" th:if="${#fields.hasErrors('contaId')}" th:errors="*{contaId}"></div>

            <label for="tipo">Tipo</label>
            <select id="tipo" th:field="*{tipo}">
                <option value="">Selecione...</option>
                <option th:each="t : ${tipos}" th:value="${t}" th:text="${t.descricao}"></option>
            </select>
            <div class="erro" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></div>

            <label for="valor">Valor (R$)</label>
            <input id="valor" type="number" step="0.01" min="0.01" th:field="*{valor}">
            <div class="erro" th:if="${#fields.hasErrors('valor')}" th:errors="*{valor}"></div>

            <label for="descricao">Descrição</label>
            <input id="descricao" th:field="*{descricao}" maxlength="200">
            <div class="erro" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></div>

            <div class="acoes">
                <button class="btn" type="submit">Salvar</button>
                <a class="btn sec" th:href="@{/transacoes}">Cancelar</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>

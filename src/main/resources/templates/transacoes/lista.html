<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Transações')}"></head>
<body>
<header th:replace="~{fragments/layout :: topo}"></header>
<main>
    <div th:replace="~{fragments/layout :: mensagens}"></div>
    <div class="card">
        <div class="topo">
            <h2>Transações</h2>
            <a class="btn" th:href="@{/transacoes/novo}">Nova transação</a>
        </div>
        <p class="vazio" th:if="${#lists.isEmpty(transacoes)}">Nenhuma transação registrada.</p>
        <table th:unless="${#lists.isEmpty(transacoes)}">
            <thead>
            <tr><th>ID</th><th>Data</th><th>Conta</th><th>Tipo</th><th class="num">Valor</th><th>Descrição</th><th>Ações</th></tr>
            </thead>
            <tbody>
            <tr th:each="t : ${transacoes}">
                <td th:text="${t.id}"></td>
                <td th:text="${#temporals.format(t.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${t.conta.numero + ' - ' + t.conta.titular}"></td>
                <td th:text="${t.tipo.descricao}"></td>
                <td class="num" th:classappend="${t.tipo.name() == 'DEPOSITO'} ? 'entrada' : 'saida'"
                    th:text="${#numbers.formatDecimal(t.valor, 1, 'POINT', 2, 'COMMA')}"></td>
                <td th:text="${t.descricao}"></td>
                <td>
                    <a class="btn peq" th:href="@{/transacoes/{id}/editar(id=${t.id})}">Editar</a>
                    <form class="inline" method="post" th:action="@{/transacoes/{id}/excluir(id=${t.id})}"
                          onsubmit="return confirm('Excluir a transação? O saldo será estornado.');">
                        <button class="btn peq perigo" type="submit">Excluir</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
